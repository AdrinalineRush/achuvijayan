<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Achu Vijayan</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0a">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#0b0b0a;--fg:#ece8df;--muted:#8f8c84;--line:rgba(236,232,223,.14);--lime:#d8fa63}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:radial-gradient(120% 80% at 50% 0%,#1a1c15 0%,var(--bg) 60%);color:var(--fg);font:400 16px/1.65 'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:520px}
img{width:72px;height:72px}
.tc{font:500 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
h1{margin:0;font-size:clamp(44px,10vw,84px);font-weight:600;line-height:.95;letter-spacing:-.05em}
h1 span{color:var(--lime)}
p{margin:0;color:var(--muted)}
a.pill{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:13px 22px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-size:14px;font-weight:500;transition:background .3s,color .3s,border-color .3s}
a.pill:hover,a.pill:focus-visible{background:var(--fg);color:var(--bg);border-color:var(--fg)}
a.pill:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
</style>
</head>
<body>
<main>
  <img src="/assets/icons/logo-metal.svg" alt="" width="72" height="72">
  <span class="tc" aria-hidden="true">00:00:00:00 · NO SIGNAL</span>
  <h1>Frame <span>missing.</span></h1>
  <p>This page was cut from the timeline, or it never made it into the edit. The films are still where you left them.</p>
  <a class="pill" href="/">Back to the portfolio <span aria-hidden="true">↗</span></a>
</main>
</body>
</html>
